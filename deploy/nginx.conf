# Replace the domain and certificate paths before enabling this file.
server {
    listen 80;
    server_name catequesis.example.org;
    return 301 https://catequesis.example.org$request_uri;
}
server {
    listen 443 ssl;
    server_name catequesis.example.org;
    ssl_certificate /etc/letsencrypt/live/catequesis.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/catequesis.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host catequesis.example.org;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
